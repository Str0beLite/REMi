# The console's web server (frontend/Dockerfile). /setup/ reaches this machine's node over the compose network for
# onboarding (backend/runtime/remi/setup.py); the node publishes no port of its own.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /setup/ {
    resolver 127.0.0.11 valid=10s;  # Docker's DNS, looked up per request so nginx starts before the node does
    set $node http://node:7078;
    proxy_pass $node;
  }

  location / {
    try_files $uri /index.html;
  }
}
