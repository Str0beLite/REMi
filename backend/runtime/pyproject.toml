[project]
name = "remi"
version = "0.1.0"
description = "REMi agent runtime: agent loop, tools, sandbox, sleep cycle"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: needs the 5070 Ti PC; run with `uv run pytest -m gpu`"]
