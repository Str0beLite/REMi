[project]
name = "remi"
version = "0.1.0"
description = "REMi agent runtime: agent loop, tools, sandbox, sleep cycle"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
# lane:gpu serving + trainer, WSL2/Linux only (vLLM has no Windows build). Pinned to the stack proven
# on the 5070 Ti. Install in WSL: UV_PROJECT_ENVIRONMENT=~/.venvs/remi-gpu uv sync --extra gpu
gpu = [
  "vllm==0.33.0; sys_platform == 'linux'",
  "peft==0.21.2; sys_platform == 'linux'",
  "transformers==5.20.2; sys_platform == 'linux'",
  "trl==1.17.1; sys_platform == 'linux'",
  "datasets==5.1.0; sys_platform == 'linux'",
]
# CPU-only training stack (CI and laptops): runs the trainer tests on a tiny model. Can't be combined with gpu.
cpu = [
  "torch==2.14.0",
  "peft==0.21.2",
  "transformers==5.20.2",
  "trl==1.17.1",
  "datasets==5.1.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: needs the 5070 Ti PC; run with `uv run pytest -m gpu`"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
